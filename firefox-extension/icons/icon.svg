  </defs>
  <g clip-path="url(#tile-clip)">
    <rect width="96" height="96" rx="24" fill="url(#bg)"/>
    <circle cx="28" cy="24" r="34" fill="url(#glow)"/>
    <g transform="rotate(-29 48 48)" filter="url(#shadow)">
      <rect x="21" y="47" width="43" height="20" rx="10" fill="url(#shorts)"/>
      <rect x="31" y="29" width="43" height="20" rx="10" fill="url(#shorts)"/>
    </g>
    <path d="M41 39 56.6 48 41 57Z" fill="#ffffff"/>
    <circle cx="48" cy="48" r="36.5" fill="none" stroke="#a3a3a3" stroke-width="5"/>
    <path d="M24.5 75 71.5 21.5" fill="none" stroke="#a3a3a3" stroke-linecap="round" stroke-width="5"/>
  </g>
